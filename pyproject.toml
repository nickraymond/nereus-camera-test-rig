[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nereus-camera-test-rig"
version = "0.0.0"
description = "Evaluation rig comparing Raspberry Pi IMX708, OpenMV N6, and OpenMV AE3 cameras."
requires-python = ">=3.10"
readme = "README.md"
# Core runtime deps kept minimal so the host-side unit tests install and run on a
# Mac without heavy/native packages. Hardware- and analysis-specific dependencies
# are optional extras, pulled in per phase (see docs/prior_art_review.md).
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Reference-card / AprilTag pipeline (Phase 2). ArUco needs the CONTRIB build; the
# HEADLESS variant drops the GUI deps (libGL/X11) so it imports on a headless Pi
# coordinator without apt-installed system libs. The rig never opens a window.
analysis = [
    "opencv-contrib-python-headless>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
]
# Pi <-> OpenMV USB transport (Phase 3+).
serial = [
    "pyserial>=3.5",
    "mpremote>=1.20",   # host_tools/deploy_openmv.py copies the board service (1.29.0 on nereus002)
]
# Local result-review web app (Phase 6). Pillow: cut-sheet export + view-time
# color-patch check (also already present via the analysis extra on the Pi).
web = [
    "Flask>=3.0",
    "Pillow>=10.0",
]
# Phase 8 edge color correction (SPEC §20). Lists its own deps — never pulls in
# [analysis], whose pillow-heif carries a GPL classifier. Every package in base + [color]
# must be reviewed in configs/licenses.yaml (`make license-check`). The PyPI OpenCV wheel
# is dev_only: it bundles FFmpeg + GPL codecs, so shipped installs need a GPL-free build
# (OQ-36, `make license-check-shipped`).
color = [
    "numpy>=1.24",
    "opencv-contrib-python-headless>=4.8",
    "tifffile>=2023.1",
]
# Mac-only TG-7 analysis tools (host_tools/tg7/). rawpy bundles LGPL LibRaw: internal use
# only, never imported from src/ (SPEC §20).
tg7 = [
    "rawpy>=0.19",
    "matplotlib>=3.8",   # host_tools/click_corners.py (manual card corners)
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "packaging>=23.0",   # host_tools/license_check.py parses requirement markers
]

[project.scripts]
nereus-rig = "nereus_camera_test_rig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put THIS checkout first on sys.path: the shared venv's editable install points at the
# primary checkout, so without this a git worktree silently tests the wrong code.
pythonpath = ["src", "."]
addopts = "-ra"
# Hardware tests require real devices; run them explicitly, not in the default suite.
norecursedirs = ["tests/hardware"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "host_tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

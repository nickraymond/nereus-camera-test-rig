# TG-7 Channel Islands dataset (Sep 15-16, 2026) — dataset config for the Phase 8 tool
# (SPEC §4 Phase 8 S1, §20). Versioned here, never written into the dataset folder, which is
# read-only and lives only in the primary checkout (data/tg7_channel_islands/).

dataset: tg7_channel_islands
camera: om_tg7

# The camera JPEG is the RAW cropped at (8, 8) — identical on all 308 ORFs (LibRaw crop
# margins, verified 2026-09-26, S0.5). locate stores card quads in both frames.
jpeg_offset_in_raw: [8, 8]
no_card_categories: [4_no_card]
# Manual card corners (locate method c), clicked with `host_tools.color click`. Versioned here
# because it is human work; `locate` only reads it. Path is relative to this file.
manual_corners: tg7_channel_islands_manual_corners.json

# Four dives (Nick, 2026-09-26; OQ-35). `ingest` assigns dive_id from time gaps between shots;
# these windows are a cross-check (an assigned dive must fall inside its window). Times are
# UTC — the camera clock was UTC-8 (PST), so the camera-local dates in the brief differ.
dives:
  1: {site: santa_cruz_island, start_utc: "2026-09-16T01:32:26Z", end_utc: "2026-09-16T02:30:23Z",
      note: "evening dive near sunset; card clean until ~P9150408 (SPEC §20)"}
  2: {site: santa_cruz_island, start_utc: "2026-09-16T15:50:20Z", end_utc: "2026-09-16T16:30:12Z"}
  3: {site: anacapa_island, start_utc: "2026-09-16T17:59:08Z", end_utc: "2026-09-16T18:52:56Z"}
  4: {site: anacapa_island, start_utc: "2026-09-16T20:15:16Z", end_utc: "2026-09-16T21:04:26Z"}

# No GPS in the files (OQ-38) and exact dive sites were not logged: island-level coordinates,
# used only for sun elevation. ±0.2° in position changes solar elevation by ≲0.3°, small next
# to the light changes being modelled.
sites:
  santa_cruz_island: {lat: 34.00, lon: -119.75, precision: island_centroid_approx}
  anacapa_island: {lat: 34.01, lon: -119.40, precision: island_centroid_approx}

# What the camera looked through, for distance z (S1.4): the effective focal length is ×1.33
# in water (flat front glass). Depth cannot decide it — P9160474 is in air at 0.4 m while
# P9150343 is under water at 0.4 m — so the exceptions come from a visual review of the
# 0_surface_card frames (Claude, 2026-09-26): two on the boat deck, one shot from above the
# water, one with the lens split at the waterline (no z). Every other frame is under water.
medium:
  default: water
  air: [P9150341, P9160474, P9160571]
  split: [P9150342]

# Card water damage (SPEC §20, brief §7 P1.0) — qc excludes these, never repairs them.
card_damage:
  from_stem: P9150409          # this frame and every later one (by capture time)
  patches: [gray_white, gray_light, gray_mid_left]
  # First/last frame of the cell-ratio baseline: the whole clean-card period. The SPEC's
  # first choice, P9150343-P9150360, has only 8 located frames, almost all at 15 m in even
  # light; with it, 33 % of clean-period patches failed the test (S1.7 finding, 2026-09-26).
  clean_reference: [P9150341, P9150408]

# Diver torch in view (dataset README) — artificial light, excluded from ambient-light work.
torch_frames: [P9160606, P9160616, P9160617]

# Table-mode scene distance for frames without a card distance (S2a, brief §7 P1.3 "assumed
# scene distance, e.g. 2-3 m"). Table mode on card frames is also reported with this value
# ("default z") next to the card's own z ("oracle z").
default_scene_z_m: 2.0

# Water-model fit and depth white-balance table (S2a). Dataset facts, not code, so the tool
# re-runs on a new dataset without code changes.
fit:
  reference_category: 1_reference_A_iso100      # distance sweeps: the water-model fit
  wb_categories: [1_reference_A_iso100, 2_underwater_preset, 3_scene_card_offcenter]
  table_source_dives: ["3", "4"]                # stable light; each dive is left out of its own table
  flagged_dives:
    "1": "sunset dive: light falls through the dive"
    "2": "early-morning dive: light rises through the dive"

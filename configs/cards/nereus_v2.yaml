# Nereus Reef Reference Card V2 — single source of truth for Phase 8 (SPEC §20).
#
# Geometry: patch boxes from tests/fixtures/reference_card/template_layout.json
#   (template v2_11x17_rgb_vector_crop_bleed), in the canonical 3000x1000 rectified frame.
# Truth: the SVG design fills from nereus-vision-dev
#   backend/app/services/processing/profiles/template_layout_v2.json @ 6aeb1c2 (staging) —
#   the same truth the backend GRVI correction uses. The rig fixture's raster-sampled values
#   are ~1 count off on 11 of 17 patches; its geometry is identical.
# Tags: centres + edge lengths measured with analysis/apriltag_detector.detect_tags on
#   reference_card_template_3000x1000.png (2026-09-26). Canonical pixels are NOT square
#   (x and y scale differently in the warp) — compute distance in card mm, never canonical px.
#
# Known differences vs web/color_check.py (Phase 6 view-time check; intentionally not changed,
# not pinned by tests):
#   gray_white: named 'white'; centre offset (-5, 15) px
#   gray_light: named 'grey 200'; centre offset (0, 20) px
#   gray_mid: named 'grey 128'; centre offset (-1, 20) px
#   gray_dark: named 'grey 74'; centre offset (-2, 20) px
#   gray_black: named 'black'; centre offset (-4, 20) px
#   cream: centre offset (0, -7) px
#   tan: named 'sand'; centre offset (0, -8) px
#   ochre: named 'tan'; truth (218, 169, 110) vs (217, 169, 109); centre offset (-2, -7) px
#   orange: named 'amber'; truth (215, 146, 53) vs (216, 146, 54); centre offset (-2, -8) px
#   brown: named 'sienna'; truth (184, 109, 42) vs (185, 109, 42); centre offset (-2, -8) px
#   dark_brown: named 'brown'; truth (99, 55, 26) vs (99, 55, 25); centre offset (-2, -7) px
#   red_orange: named 'red-orange'; centre offset (0, 17) px
#   yellow: truth (248, 185, 30) vs (247, 185, 30); centre offset (0, 17) px
#   green: truth (109, 176, 79) vs (108, 176, 80); centre offset (-2, 17) px
#   cyan: truth (92, 201, 208) vs (92, 200, 208); centre offset (-2, 17) px
#   blue: centre offset (-2, 17) px
#   magenta: truth (179, 70, 163) vs (180, 70, 163); centre offset (-2, 17) px

card_id: nereus_v2
schema_version: 1

apriltag:
  family: tag36h11            # OpenCV DICT_APRILTAG_36h11
  corner_map: {tl: 0, tr: 1, bl: 2, br: 3}

# What each patch is used for (stages read this; none hard-codes patch ids). V2: white-balance
# on grey 128, its right half when the whole is excluded (the left half is water-damaged),
# grey 74 last; the ramp takes one of grey 128 / its right half; black is the haze patch.
roles:
  wb_anchors: [gray_mid, gray_mid_right, gray_dark]
  ramp: [gray_white, gray_light, gray_dark, [gray_mid, gray_mid_right]]
  haze: gray_black

canonical:                     # rectified frame: tag-centre quad expanded about its centre
  width: 3000
  height: 1000
  expand_x: 1.25
  expand_y: 2.0

tags:                          # canonical px: centre [x, y], edge [x_len, y_len]
  0: {center: [299.5, 250.0], edge: [211.0, 176.0]}
  1: {center: [2699.0, 250.0], edge: [210.0, 176.0]}
  2: {center: [299.5, 749.5], edge: [211.0, 175.0]}
  3: {center: [2699.0, 749.5], edge: [210.0, 175.0]}

# Physical size, measured from the vector print master (2026-09-26):
# tests/fixtures/reference_card/Nereus_Reef_Reference_Card_V2.pdf, a 17x11 in page drawn at
# true scale (the card outline is exactly 410.000 x 136.667 mm, 3:1). Tag values are the
# stroked tag outlines (outer edge of the black border, 90.652 pt). See docs/reference_card_v2.md.
# ASSUMPTION: the card was printed at 100 % scale (no fit-to-page). A tape check of the card
# width (410 mm) would confirm it. The printed "0-300 mm" bar is NOT an exact ruler (it is
# 298.96 mm in the vector file) — never use it for scale.
physical_mm:
  source: vector_print_master_v2_100pct_scale
  tag_center_spacing_x: 364.900
  tag_center_spacing_y: 91.566
  tag_edge: 31.980
  card_width: 410.000
  card_height: 136.667

truth:
  source: design_svg_2026-09-01
  space: srgb8                 # 8-bit sRGB design values

patches:                       # box: [x, y, w, h] in canonical px
  - {id: gray_white, group: grey, label: white_reference, box: [204, 367, 202, 272], truth: [255, 255, 255]}
  - {id: gray_light, group: grey, label: neutral_gray_light, box: [416, 288, 201, 351], truth: [200, 200, 200]}
  - {id: gray_mid, group: grey, label: neutral_gray_mid, box: [626, 288, 202, 351], truth: [128, 128, 128]}
  - {id: gray_dark, group: grey, label: neutral_gray_dark, box: [838, 288, 201, 351], truth: [74, 74, 74]}
  - {id: gray_black, group: grey, label: black_reference, box: [1050, 289, 199, 349], truth: [0, 0, 0]}
  - {id: cream, group: color, label: cream_low_saturation, box: [1635, 292, 136, 174], truth: [255, 249, 230]}
  - {id: tan, group: color, label: tan, box: [1790, 293, 135, 173], truth: [239, 212, 167]}
  - {id: ochre, group: color, label: ochre, box: [1944, 292, 136, 174], truth: [217, 169, 109]}
  - {id: orange, group: color, label: orange, box: [2098, 292, 136, 175], truth: [216, 146, 54]}
  - {id: brown, group: color, label: brown, box: [2252, 292, 136, 175], truth: [185, 109, 42]}
  - {id: dark_brown, group: color, label: dark_brown, box: [2407, 292, 135, 174], truth: [99, 55, 25]}
  - {id: red_orange, group: color, label: red_orange, box: [1635, 481, 136, 174], truth: [240, 74, 24]}
  - {id: yellow, group: color, label: yellow, box: [1790, 481, 135, 174], truth: [247, 185, 30]}
  - {id: green, group: color, label: green, box: [1944, 481, 136, 174], truth: [108, 176, 80]}
  - {id: cyan, group: color, label: cyan, box: [2098, 481, 136, 174], truth: [92, 200, 208]}
  - {id: blue, group: color, label: blue, box: [2252, 481, 136, 174], truth: [12, 102, 199]}
  - {id: magenta, group: color, label: magenta, box: [2407, 481, 135, 174], truth: [180, 70, 163]}

# Parts of a patch that can be sampled on their own (e.g. the V2 water-damage map excludes
# only the left half of grey 128). Must lie inside the parent box.
sub_patches:
  - {id: gray_mid_left, parent: gray_mid, box: [626, 288, 101, 351]}
  - {id: gray_mid_right, parent: gray_mid, box: [727, 288, 101, 351]}

# The printed card as measured (SPEC §20: real-world measurements over design files, Nick
# 2026-09-27). Written by `python -m host_tools.color measure-card` (git 77b060b), reviewed,
# pasted here; every stage then scores and fits against these values, and keeps the design
# values above for comparison. The print is much paler than its design: colours 7–39 C* less
# saturated (median dE00 13.4 from design), greys compressed (black reads 63/255, grey 128 99).
# Caveats: read through the TG-7's daylight colour matrix (OQ-39); in air on deck, so sky glare
# may lift the dark end a little; greys other than grey 74 come from the one clean-card frame.
# An instrument measurement of the card (OQ-40) replaces this block when it exists.
measured:
  source: measured_om_tg7_in_air_tg7_channel_islands
  method: in air, WB on gray_dark (design value), om_tg7 daylight colour matrix, median over frames
  reference_frames: [P9150341, P9160474, P9160571]
  values:                # 8-bit sRGB scale; greys neutral
    gray_white: [210.0, 210.0, 210.0]
    gray_light: [148.7, 148.7, 148.7]
    gray_mid: [98.9, 98.9, 98.9]
    gray_dark: [74.0, 74.0, 74.0]
    gray_black: [62.8, 62.8, 62.8]
    cream: [213.0, 207.1, 204.8]
    tan: [183.8, 171.4, 155.3]
    ochre: [166.1, 141.6, 113.8]
    orange: [163.8, 129.7, 91.4]
    brown: [146.5, 102.8, 81.5]
    dark_brown: [89.3, 66.3, 60.0]
    red_orange: [186.9, 83.3, 76.8]
    yellow: [199.4, 154.8, 95.8]
    green: [93.3, 144.5, 105.9]
    cyan: [95.7, 156.5, 173.9]
    blue: [30.9, 107.1, 148.4]
    magenta: [138.7, 78.1, 125.5]

# The printed card as measured (SPEC §20: real-world measurements over design files, Nick
# 2026-09-27). Read on nereus002 (IMX708 wide, 2026-09-28) in air, indoor window light: three
# locked RAW exposures (-1/0/+1 stop, 4608x2592, gain 1.12; results/raw_imx708/20260928T174147Z),
# card located on the RAW, white-balanced on grey 128, camera -> XYZ through the DNG's own
# ColorMatrix1 (D65, from the Pi tuning — unverified), Bradford-adapted to D65, linear sRGB,
# scaled so grey 128 = its design value, median over the three exposures (spread <= 3.6 counts,
# except blue). Greys are stored neutral at their measured luminance (their small tints come from
# the matrix). Findings: colours median dE00 6.9 from design (V2's print: 13.4); the grey ramp is
# compressed like V2's (white 227, black 67 with grey 128 = 128) — flare / glare in a bright room
# likely lifts the dark end. **Blue is unreliable:** its red goes negative through the matrix
# (-13, spread 17 over the exposures) and is stored as 0. Replace with an instrument reading or a
# calibrated IMX708 matrix (S4) when available.
measured:
  source: measured_imx708_nereus002_in_air_20260928
  method: in air, WB on gray_mid, DNG ColorMatrix1 + Bradford to D65, median over 3 exposures, scaled so gray_mid = its design value
  reference_frames: [stop_-1, stop_+0, stop_+1]
  values:                # 8-bit sRGB scale; greys neutral
    gray_white: [227.3, 227.3, 227.3]
    gray_light: [179.9, 179.9, 179.9]
    gray_mid: [128.0, 128.0, 128.0]
    gray_dark: [90.6, 90.6, 90.6]
    gray_black: [67.3, 67.3, 67.3]
    cream: [225.0, 218.1, 211.8]
    tan: [225.4, 196.4, 159.5]
    ochre: [205.3, 160.6, 112.6]
    orange: [206.3, 144.7, 76.5]
    brown: [187.5, 121.3, 72.5]
    dark_brown: [108.8, 77.4, 64.2]
    coral_pink: [217.9, 135.9, 151.0]
    red_orange: [217.1, 82.8, 65.6]
    yellow: [223.1, 166.0, 68.8]
    green: [109.9, 159.8, 97.1]
    cyan: [91.2, 174.7, 183.0]
    blue: [0.0, 117.3, 181.3]
    magenta: [153.6, 66.1, 133.4]
